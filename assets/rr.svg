<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9852C"/>
      <stop offset="50%" stop-color="#F0D58A"/>
      <stop offset="100%" stop-color="#A66F1E"/>
    </linearGradient>
  </defs>

  <!-- warm wedding background -->
  <rect width="64" height="64" rx="16" fill="#FFF8EC"/>

  <!-- intertwined wedding rings -->
  <circle cx="27" cy="31" r="13" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="37" cy="31" r="13" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- small floral accents -->
  <g fill="#8E2436">
    <circle cx="13" cy="15" r="2.2"/>
    <circle cx="17" cy="12" r="1.6"/>
    <circle cx="51" cy="15" r="2.2"/>
    <circle cx="47" cy="12" r="1.6"/>
  </g>

  <!-- initials -->
  <text x="32" y="55"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="2"
        fill="#6D2635">R&amp;R</text>
</svg>
